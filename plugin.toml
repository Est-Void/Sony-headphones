# Sony Pods for Noctalia
# Battery and noise control for Sony Bluetooth headphones (WH/WF-1000X series, LinkBuds, etc.)
# via the reverse-engineered MDR V2 RFCOMM protocol.

id = "estvoid/sony-pods"
name = "Sony Pods"
version = "0.1.0"
plugin_api = 14
author = "estvoid"
license = "MIT"
icon = "headphones"
description = "Sony headphones battery and noise control (ANC / Ambient Sound) in the bar."
tags = ["audio", "bar", "panel", "service", "hardware", "indicator"]
dependencies = ["python3"]

[[setting]]
key = "device_mac"
type = "string"
label_key = "settings.device_mac.label"
description_key = "settings.device_mac.description"
default = ""

[[widget]]
id = "sony-pods"
entry = "widget.luau"

  [widget.actions]
  left = "panel-toggle estvoid/sony-pods:panel"
  right = "plugin estvoid/sony-pods:service all cycle-noise"

  [[widget.setting]]
  key = "hide_when_disconnected"
  type = "bool"
  label_key = "settings.hide_when_disconnected.label"
  description_key = "settings.hide_when_disconnected.description"
  default = true

[[panel]]
id = "panel"
entry = "panel.luau"
width = 380
height = 600
placement = "floating"
position = "top_center"
open_near_click = false

[[service]]
id = "service"
entry = "service.luau"
